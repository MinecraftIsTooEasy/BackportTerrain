plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Replace "Country" with an ISO country code, for example: "CN".
def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("Country")

base {
    // Replace "LocalizedArchiveName" with the localized alias.
    // Prefix local JAR names with an optional alias, for example: "[Alias]" + archives_base_name.
    // Maven publishing keeps using the lowercase maven_id configured below.
    archivesName = useLocalizedArchiveName
            ? "[LocalizedArchiveName]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // Only declare repositories required by this project because Loom provides
    // the repositories needed for Minecraft and its libraries automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repository declarations.
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }// Dependency library(FastUtil, Gson, etc) download source
    maven {
        name = "ModdedMITE"
        url = "https://maven.limingzxc.top/repository/maven-public/"
    }// Mods & Loaders download source
}

configurations {
    fml
}

// RIC version skew fix.
//
// RIC 1.5.8 (the build the run/mods modpack ships, and the one Shop 1.0.5 compiles
// against) adds IKeybindingListener and KeybindingRegisterEvent.register(KeyBinding).
// The published maven artifact only goes up to 1.5.7, and 1.5.5 -- the version declared
// below -- is upgraded to 1.5.7 anyway by BetterGameSetting/ExtraGui/OhMyCommands.
//
// That leaves the dev runtime with two RIC copies: the mod jar (1.5.8) and the maven jar
// (1.5.7). IKeybindingListener then loads from 1.5.8 while KeybindingRegisterEvent loads
// from 1.5.7 through parent-first delegation, and publishing the keybinding event throws
// NoSuchMethodError: KeybindingRegisterEvent.register(net.minecraft.KeyBinding).
//
// Drop the maven module everywhere and put the same 1.5.8 jar the modpack uses on the
// classpath instead, so dev and runtime agree. libs/ is a local-only binary; refresh it
// whenever the modpack's RIC jar is updated.
configurations.configureEach {
    exclude group: "com.github.MinecraftIsTooEasy", module: "RustedIronCore"
}

dependencies {
    // Dependency versions are maintained in gradle.properties or alongside project-specific declarations below.
    // Use implementation for required mods, compileOnly for optional integrations,
    // and localRuntime for mods needed only in the development environment.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("it.unimi.dsi:fastutil:8.5.12")
    implementation("com.google.code.gson:gson:2.11.0")

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"

    // The most basic dependency library mod, with a status similar to Fabric API.
    // Sourced from libs/ rather than maven; see the RIC version skew note above.
    implementation files("libs/rustedironcore-1.5.8.jar")
    implementation "org.moddedmite:BetterGameSetting:1.5.0-build.2026090500"
    localRuntime "com.github.MinecraftIsTooEasy:ManyLib:2.3.1"
    localRuntime "com.github.MinecraftIsTooEasy:ExtraGui:1.3.7"
    localRuntime "com.github.MinecraftIsTooEasy:OhMyCommands:3.0.0-mc1.6.4-MITE-20260629"

    // To add strong dependencies, use "implementation" like above
    // To compile mod integrations(e.g. ModMenu), use "compileOnly"
    // To add mods for running client, use "localRuntime"
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    accessWidenerPath = file("src/main/resources/bpt.accesswidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())
    mods {
        "modid" {
            sourceSet sourceSets.main
//            sourceSet sourceSets.client
//            sourceSet sourceSets.server
//            For modules in the 'src' directory, only the main source set is required by default.
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs "--userProperties", "{}", "--username", name, "--session", "a.a.a.a", "--width", width, "--height", height
        }
//        server {
//            programArgs "--", ""
//        }
    }
}

// Dev-run log4j fix.
//
// loom regenerates .gradle/loom-cache/log4j.xml on every run from its bundled
// log4j2.fabric.xml template. None of that template's patterns contain a throwable
// token, so log4j2 auto-appends %xEx (ExtendedThrowablePatternConverter), which resolves
// every stack-trace frame class through log4j's own class loader. In a dev run the remapped
// Minecraft jar sits on the system class path while KnotClassLoader has already defined the
// same classes, so logging any exception whose stack contains a net.minecraft.* frame throws
// "LinkageError: loader constraint violation" inside the appender. Every appender then fails
// and the real exception never reaches the log (empty output-client.log, no crash report).
//
// Appending an explicit %throwable selects the plain ThrowablePatternConverter, which only
// calls Throwable.printStackTrace and loads no classes. Stack traces still print in full.
tasks.matching { it.name == "generateLog4jConfig" }.configureEach {
    doLast {
        def configFile = file(".gradle/loom-cache/log4j.xml")
        if (!configFile.exists() || configFile.text.contains("%throwable")) {
            return
        }
        def original = configFile.text
        def patched = original
                .replace("%msg{nolookups}%n", "%msg{nolookups}%throwable%n")
                .replace("%msg%n", "%msg%throwable%n")
        if (patched == original) {
            logger.warn("[bpt] no '%msg%n' token in ${configFile}; dev log4j config left unpatched")
            return
        }
        configFile.text = patched
        logger.lifecycle("[bpt] patched dev log4j config to use the plain %throwable converter")
    }
}

processResources {
    inputs.properties(
            version: project.version,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    // Loom automatically attaches sourcesJar to remapSourcesJar and the build lifecycle when it is present.
    // Remove this line only when source artifacts should not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { String fileName -> "${fileName}_${inputs.properties.archivesName}" }
    }
}

// Configure the Maven publication.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.maven_id
            from(components.java)
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.

        // ModdedMITE release repository.
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
